<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 M2 Christmas Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="shared.js?v=2"></script>
<script src="games.js?v=3"></script>
<style>
:root {
  --red: #C8202F; --red-dark: #8E1220; --cream: #FFF6E4; --paper: #FFF9EC;
  --brown: #5A3821; --gold: #F6C343; --green: #1F7A45;
  --font: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); color: var(--brown); word-break: keep-all;
  background-color: var(--red-dark);
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.18) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 80%, rgba(255,255,255,.14) 0 2px, transparent 3px),
    radial-gradient(circle at 45% 55%, rgba(255,255,255,.10) 0 1.5px, transparent 2.5px);
  background-size: 90px 90px, 130px 130px, 60px 60px;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#stage {
  position: relative; container-type: inline-size;
  width: min(100vw, calc(100vh * 1672 / 941)); width: min(100vw, calc(100dvh * 1672 / 941));
  aspect-ratio: 1672 / 941; overflow: hidden; background: #3a1018;
  box-shadow: 0 0 40px rgba(0,0,0,.35);
}
.screen { position: absolute; inset: 0; display: none; }
.screen.on { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.screen > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
.abs { position: absolute; }

/* 누르는 영역 */
.hot {
  position: absolute; border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer;
  border-radius: 2cqw; transition: box-shadow .15s, background-color .15s, transform .15s;
}
.hot:hover, .hot:focus-visible {
  background: rgba(255, 244, 200, .14);
  box-shadow: 0 0 0 .3cqw rgba(255, 226, 120, .95), 0 0 2cqw rgba(255, 220, 110, .7);
  transform: scale(1.02); outline: none;
}
.hot:active { transform: scale(.98); }
.hot.pill { border-radius: 999px; }

/* 종이 덮개 */
.pill-cover {
  position: absolute; display: flex; align-items: center; justify-content: center; gap: .6cqw;
  background: linear-gradient(#FFFBF1, #F8EBD2); border: .25cqw solid var(--brown); border-radius: 999px;
  box-shadow: inset 0 -.3cqw 0 rgba(90,56,33,.12), 0 .3cqw 0 rgba(60,30,15,.35);
  font-size: 2.5cqw; color: var(--brown); white-space: nowrap;
}
.pill-cover.label { justify-content: flex-start; padding-left: 2.2cqw; font-size: 2.6cqw; }

/* 상단 메뉴줄 */
.nav {
  position: absolute; display: flex; align-items: center; gap: .55cqw; padding: 0 .9cqw;
  background: linear-gradient(#FFFBF1, #F6E7CB); border: .25cqw solid var(--brown); border-radius: 999px;
  box-shadow: 0 .3cqw 0 rgba(60,30,15,.4);
}
.nav .hello { font-size: 1.35cqw; white-space: nowrap; margin-right: auto; padding-left: .4cqw; }
.nav .hello b { color: var(--red); font-weight: normal; }
.nav button {
  font-family: var(--font); font-size: 1.25cqw; color: var(--brown); white-space: nowrap;
  background: #FFFCF4; border: .16cqw solid var(--brown); border-radius: 999px;
  padding: .45cqw .85cqw; cursor: pointer; box-shadow: 0 .18cqw 0 rgba(60,30,15,.3);
}
.nav button:hover, .nav button:focus-visible { background: #FFF0C4; outline: none; }
.nav button.mus { background: #F3FBF5; border-color: var(--green); color: var(--green); }
.nav button.on { background: var(--red); color: #fff; border-color: var(--red-dark); }

/* 마을 지도 위 내 정보 */
.chip {
  position: absolute; right: 1.2cqw; top: 1.2cqw; display: flex; align-items: center; gap: .7cqw;
  background: rgba(255, 250, 238, .96); border: .22cqw solid var(--brown); border-radius: 999px;
  padding: .45cqw .6cqw .45cqw 1.2cqw; font-size: 1.35cqw; box-shadow: 0 .3cqw 0 rgba(60,30,15,.4);
}
.chip .pt { color: var(--red); }
.chip button, .small-btn {
  font-family: var(--font); font-size: 1.1cqw; color: var(--brown); background: #FFF; cursor: pointer;
  border: .15cqw solid var(--brown); border-radius: 999px; padding: .3cqw .8cqw;
}
.chip button:hover, .small-btn:hover { background: #FFF0C4; }

/* 지도: 영화관 → 마켓 간판 */
.market-sign {
  position: absolute; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(#6B3F22, #4A2814); color: #FFF3D6; border: .3cqw solid #F4C766;
  border-radius: 999px; font-size: 2.35cqw; letter-spacing: .05cqw;
  box-shadow: 0 0 0 .25cqw #3A1E0E, 0 0 1.4cqw rgba(255,210,110,.7);
}
.market-sign::before, .market-sign::after {
  content: ''; position: absolute; top: 50%; width: .6cqw; height: .6cqw; margin-top: -.3cqw;
  border-radius: 50%; background: #FFE9A3; box-shadow: 0 0 .6cqw #FFD45C;
}
.market-sign::before { left: 1cqw; } .market-sign::after { right: 1cqw; }
.shop-window {
  position: absolute; display: flex; align-items: center; justify-content: center;
  background: repeating-linear-gradient(90deg, #E43B45 0 1.1cqw, #FFF4E2 1.1cqw 2.2cqw);
  border: .25cqw solid #3A1E0E; border-radius: .8cqw .8cqw .4cqw .4cqw;
}
.shop-window span {
  background: #FFF9EC; color: var(--red); border: .18cqw solid #3A1E0E; border-radius: .6cqw;
  font-size: 1.35cqw; padding: .1cqw .8cqw;
}

/* 게임 타일 Coming soon */
.soon {
  position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 1.6cqw;
  background: rgba(255, 248, 232, .72); backdrop-filter: grayscale(.8);
}
.soon span {
  background: #8A7A6B; color: #fff; font-size: 1.6cqw; padding: .4cqw 1.2cqw; border-radius: 999px;
  transform: rotate(-6deg); border: .2cqw solid #fff; box-shadow: 0 .3cqw 0 rgba(0,0,0,.25);
}

/* 종이 패치 */
.paper {
  position: absolute; background: var(--paper); display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; border-radius: .8cqw;
}

/* 입장 화면 입력칸 */
.field {
  position: absolute; display: flex; align-items: center; gap: .9cqw; padding: 0 1.6cqw;
  background: #FFFDF7; border: .22cqw solid #A9785A; border-radius: 999px;
  box-shadow: inset 0 .25cqw .4cqw rgba(90,56,33,.12);
}
.field:focus-within { border-color: var(--red); box-shadow: 0 0 0 .35cqw rgba(200,32,47,.18); }
.field svg { width: 1.9cqw; height: 1.9cqw; flex: none; }
.field input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  font-family: var(--font); font-size: 1.55cqw; color: var(--brown);
}
.field input::placeholder { color: #9C8676; }
.login-msg {
  position: absolute; left: 30%; width: 40%; top: 89.6%; text-align: center; font-size: 1.45cqw;
  color: #fff; text-shadow: 0 .15cqw .3cqw rgba(0,0,0,.6); min-height: 2cqw;
}
.login-msg.err { color: #FFE27A; }

/* 캐럴 버튼 */
#musicBtn {
  position: absolute; left: 1cqw; bottom: 1.2cqw; z-index: 30; width: 4.4cqw; height: 4.4cqw;
  border-radius: 50%; border: .22cqw solid var(--brown); background: #FFF9EC; cursor: pointer;
  display: none; align-items: center; justify-content: center; box-shadow: 0 .3cqw 0 rgba(60,30,15,.4);
}
#musicBtn svg { width: 2.4cqw; height: 2.4cqw; }
#musicBtn.off svg .slash { display: block; } #musicBtn svg .slash { display: none; }

/* 미리보기 표시 */
#previewTag {
  position: absolute; right: 1cqw; bottom: 1cqw; z-index: 30; font-size: 1.05cqw; color: #fff;
  background: rgba(0,0,0,.45); padding: .25cqw .8cqw; border-radius: 999px; display: none;
}

/* 알림 */
#toast {
  position: absolute; left: 50%; top: 46%; z-index: 50; transform: translate(-50%, -50%) scale(.9);
  background: #FFF9EC; border: .3cqw solid var(--brown); border-radius: 2cqw; padding: 1.4cqw 2.6cqw;
  font-size: 2cqw; text-align: center; opacity: 0; pointer-events: none; transition: .2s;
  box-shadow: 0 .5cqw 0 rgba(60,30,15,.4);
}
#toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* 창 */
.modal-bg {
  position: absolute; inset: 0; z-index: 40; background: rgba(40,10,15,.55);
  display: none; align-items: center; justify-content: center;
}
.modal-bg.on { display: flex; }
.modal {
  background: var(--paper); border: .35cqw solid var(--brown); border-radius: 2.2cqw; padding: 2.2cqw 2.8cqw;
  min-width: 34cqw; text-align: center; box-shadow: 0 .6cqw 0 rgba(60,30,15,.45);
}
.modal h3 { margin: 0 0 1.4cqw; font-weight: normal; font-size: 2.3cqw; color: var(--red); }
.modal .choices { display: flex; flex-direction: column; gap: .9cqw; }
.big-btn {
  font-family: var(--font); font-size: 1.8cqw; color: #fff; background: var(--red); cursor: pointer;
  border: .25cqw solid var(--red-dark); border-radius: 999px; padding: .8cqw 2cqw; box-shadow: 0 .35cqw 0 var(--red-dark);
}
.big-btn.light { background: #FFFCF4; color: var(--brown); border-color: var(--brown); box-shadow: 0 .35cqw 0 rgba(60,30,15,.35); }
.big-btn:hover { filter: brightness(1.06); }

/* 마켓 (코드로 그린 화면) */
#s-market {
  background-color: var(--red);
  background-image:
    radial-gradient(circle, rgba(255,255,255,.22) 0 .25cqw, transparent .3cqw),
    repeating-linear-gradient(45deg, transparent 0 3cqw, rgba(255,255,255,.05) 3cqw 6cqw);
  background-size: 5cqw 5cqw, auto;
}
.market-head { position: absolute; left: 0; right: 0; top: 2cqw; display: flex; justify-content: center; }
.market-title {
  background: linear-gradient(#6B3F22, #4A2814); color: #FFF3D6; font-size: 3.6cqw; padding: .6cqw 4cqw;
  border-radius: 999px; border: .35cqw solid #F4C766; box-shadow: 0 0 0 .3cqw #3A1E0E, 0 .6cqw 0 rgba(0,0,0,.3);
}
.market-body {
  position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: 50cqw;
  background: var(--paper); border: .4cqw solid var(--brown); border-radius: 2.4cqw; padding: 3cqw;
  text-align: center; box-shadow: 0 .7cqw 0 rgba(60,30,15,.5);
}
.market-body p { margin: 0 0 1cqw; font-size: 2.4cqw; }
.market-body small { font-size: 1.5cqw; color: #8A6A55; }
.back-btn {
  position: absolute; right: 1.4cqw; top: 1.6cqw; font-family: var(--font); font-size: 1.6cqw; color: var(--brown);
  background: #FFF9EC; border: .25cqw solid var(--brown); border-radius: 999px; padding: .6cqw 1.6cqw; cursor: pointer;
  box-shadow: 0 .3cqw 0 rgba(60,30,15,.4);
}
.back-btn:hover { background: #FFF0C4; }

/* 게임 화면 */
#s-game {
  background-color: var(--red-dark);
  background-image: radial-gradient(circle, rgba(255,255,255,.16) 0 .22cqw, transparent .26cqw);
  background-size: 4cqw 4cqw;
}
.game-top {
  position: absolute; left: 1.2cqw; right: 1.2cqw; top: 1cqw; height: 4.6cqw; display: flex; align-items: center; gap: 1.2cqw;
  background: linear-gradient(#FFFBF1, #F6E7CB); border: .25cqw solid var(--brown); border-radius: 999px; padding: 0 1cqw 0 1.6cqw;
  box-shadow: 0 .3cqw 0 rgba(60,30,15,.45);
}
.game-title { font-size: 2.1cqw; color: var(--red); white-space: nowrap; }
.game-stats { flex: 1; text-align: center; font-size: 1.6cqw; white-space: nowrap; }
.game-stats b { color: var(--red); font-weight: normal; font-size: 1.9cqw; }
.game-top .small-btn { font-size: 1.4cqw; padding: .4cqw 1.3cqw; }
.game-area {
  position: absolute; left: 1.2cqw; right: 1.2cqw; top: 7cqw; bottom: 1.2cqw; overflow: hidden;
  border: .3cqw solid var(--brown); border-radius: 1.8cqw; background: #FFF6E4; touch-action: none; user-select: none;
}
.g-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.g-card {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 46cqw; text-align: center;
  background: var(--paper); border: .35cqw solid var(--brown); border-radius: 2.2cqw; padding: 2cqw 2.4cqw 2.4cqw;
  box-shadow: 0 .6cqw 0 rgba(60,30,15,.35);
}
.g-card h3 { margin: .4cqw 0 .8cqw; font-weight: normal; font-size: 3cqw; color: var(--red); }
.g-card p { margin: 0 0 1.6cqw; font-size: 1.6cqw; line-height: 1.5; }
.g-icon svg { width: 9cqw; height: 9cqw; }
.g-over { position: absolute; inset: 0; background: rgba(40,10,15,.45); z-index: 5; animation: fadeIn .25s; }
.g-score { font-size: 6cqw; color: var(--brown); line-height: 1.1; margin-bottom: .6cqw; }
.g-score small { font-size: 2.4cqw; margin-left: .3cqw; }
.g-new { color: var(--red); font-weight: normal; font-size: 2cqw; }
.g-btns { display: flex; gap: 1.2cqw; justify-content: center; }

/* 캐릭터를 잡아라 */
.wh-wrap {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: grid; grid-template-columns: repeat(3, 15cqw); gap: .4cqw 4cqw;
}
.wh-wrap.shake { animation: shake .3s; }
@keyframes shake { 25% { margin-left: -.8cqw; } 75% { margin-left: .8cqw; } }
.wh-hole { position: relative; width: 15cqw; height: 15cqw; overflow: hidden; }
.wh-pop {
  position: absolute; left: 1.5cqw; width: 12cqw; height: 12cqw; bottom: -12cqw; cursor: pointer;
  transition: bottom .14s ease-out, transform .12s;
}
.wh-pop svg { width: 100%; height: 100%; display: block; pointer-events: none; }
.wh-pop.up { bottom: 2.4cqw; }
.wh-pop.gold svg { filter: drop-shadow(0 0 .8cqw #FFD43B) drop-shadow(0 0 .4cqw #FFB000); }
.wh-pop.hit { transform: scale(.85) rotate(-8deg); }
.wh-hole::before {
  content: ''; position: absolute; left: 1.6cqw; right: 1.6cqw; bottom: 1.6cqw; height: 3.4cqw; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 40%, #2A1B2E 55%, #4B3550 100%);
}
.wh-snow {
  position: absolute; left: .2cqw; right: .2cqw; bottom: 0; height: 3.4cqw; pointer-events: none;
  background: linear-gradient(#FFFFFF, #E4EEFA); border: .25cqw solid #9DB4D2; border-bottom: 0;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
}
.wh-float { position: absolute; left: 50%; top: 10%; transform: translateX(-50%); font-size: 2.6cqw; color: var(--green); animation: floatUp .7s forwards; pointer-events: none; text-shadow: 0 0 .3cqw #fff; }
.wh-float.bad { color: var(--red); }
@keyframes floatUp { to { top: -20%; opacity: 0; } }
.game-area:has(.wh-wrap) { background: linear-gradient(#BFD9F2, #EEF5FD 60%, #FFFFFF); }

/* 메모리 카드 */
.mm-grid {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: grid; grid-template-columns: repeat(4, 10cqw); gap: 1.1cqw;
}
.mm-card { width: 10cqw; height: 10cqw; padding: 0; border: 0; background: none; cursor: pointer; perspective: 60cqw; }
.mm-in { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
.mm-card.open .mm-in, .mm-card.done .mm-in { transform: rotateY(180deg); }
.mm-back, .mm-front {
  position: absolute; inset: 0; border-radius: 1.2cqw; border: .25cqw solid var(--brown); backface-visibility: hidden;
  -webkit-backface-visibility: hidden; box-shadow: 0 .3cqw 0 rgba(60,30,15,.35);
}
.mm-back {
  background-color: var(--red);
  background-image: radial-gradient(circle, rgba(255,255,255,.6) 0 .35cqw, transparent .4cqw), linear-gradient(90deg, transparent 43%, #FFD43B 43% 57%, transparent 57%), linear-gradient(transparent 43%, #FFD43B 43% 57%, transparent 57%);
  background-size: 2.5cqw 2.5cqw, 100% 100%, 100% 100%;
}
.mm-front { background: #FFFDF6; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; }
.mm-front svg { width: 80%; height: 80%; }
.mm-card.done .mm-front { background: #FFF3C4; }
.mm-card:hover:not(.open):not(.done) .mm-in { transform: translateY(-.3cqw); }

@media (prefers-reduced-motion: reduce) { .screen.on { animation: none; } .hot { transition: none; } }
</style>
</head>
<body>
<div id="stage">

  <!-- 1. 초대장 -->
  <section class="screen" id="s-invite">
    <img class="bg" alt="" data-img="invite">
    <label class="field" style="left:29.5%;top:71%;width:20.2%;height:7.6%">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5A3821" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.3-6.5 8-6.5s7 2 8 6.5"/></svg>
      <input id="inName" placeholder="이름 입력" autocomplete="off" aria-label="이름">
    </label>
    <label class="field" style="left:50.3%;top:71%;width:20.2%;height:7.6%">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5A3821" stroke-width="2.2"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
      <input id="inCode" type="password" placeholder="초대코드 입력" inputmode="numeric" autocomplete="off" aria-label="초대코드">
    </label>
    <button class="hot pill" id="loginBtn" style="left:37.3%;top:80.4%;width:25.4%;height:9.2%" aria-label="마을로 입장하기"></button>
    <div class="login-msg" id="loginMsg"></div>
  </section>

  <!-- 2. 마을 지도 -->
  <section class="screen" id="s-map">
    <img class="bg" alt="" data-img="map">
    <svg class="abs" viewBox="0 0 100 80" style="left:13.2%;top:39.6%;width:7.4%;height:8.4%" aria-hidden="true">
      <rect x="10" y="30" width="80" height="46" rx="5" fill="#E43B45" stroke="#3A1E0E" stroke-width="4"/>
      <rect x="4" y="20" width="92" height="16" rx="4" fill="#F0525B" stroke="#3A1E0E" stroke-width="4"/>
      <rect x="43" y="20" width="14" height="56" fill="#F6C343" stroke="#3A1E0E" stroke-width="3"/>
      <path d="M50 20 C34 2 18 8 28 18 Z M50 20 C66 2 82 8 72 18 Z" fill="#F6C343" stroke="#3A1E0E" stroke-width="4"/>
    </svg>
    <div class="shop-window" style="left:14.4%;top:56.3%;width:6.6%;height:7.9%"><span>OPEN</span></div>
    <div class="market-sign" style="left:10%;top:47.9%;width:18.6%;height:7.8%">크리스마스 마켓</div>
    <button class="hot" data-go="gameland" style="left:19%;top:22%;width:21%;height:26%" aria-label="게임랜드"></button>
    <button class="hot" data-go="quizhouse" style="left:60%;top:21%;width:24%;height:26%" aria-label="퀴즈하우스"></button>
    <button class="hot" data-go="tree" style="left:40.5%;top:25%;width:20%;height:33%" aria-label="추억 트리"></button>
    <button class="hot" data-go="market" style="left:7%;top:42%;width:22%;height:22%" aria-label="크리스마스 마켓"></button>
    <button class="hot" data-go="award" style="left:72%;top:42%;width:24%;height:23%" aria-label="연말 시상식"></button>
    <button class="hot" data-go="post" style="left:17%;top:61%;width:19%;height:24%" aria-label="비밀 우체국"></button>
    <button class="hot" data-go="door" style="left:40%;top:64%;width:21%;height:32%" aria-label="중3으로 향하는 문"></button>
    <button class="hot" data-go="guestbook" style="left:63%;top:61%;width:22%;height:24%" aria-label="방명록"></button>
    <div class="chip"><span id="chipName"></span><span class="pt" id="chipPt"></span><button data-music="1" class="mus">캐럴 끄기</button><button id="logoutBtn">나가기</button></div>
  </section>

  <!-- 3. 게임랜드 -->
  <section class="screen" id="s-gameland">
    <img class="bg" alt="" data-img="gameland">

<script>
(function () {
  var S = window.SHARED;
  var V = S.VERSION;
  var LIVE = location.hostname === S.PROD_HOST && !!S.API_URL;
  var me = null;

  // ---------- 그림 불러오기 (버전 번호 붙이기) ----------
  document.querySelectorAll('img[data-img]').forEach(function (im) {
    im.src = 'images/' + im.dataset.img + '.webp?v=' + V;
  });
  if (!LIVE) document.getElementById('previewTag').style.display = 'block';

  // ---------- 미리보기용 가짜 데이터 ----------
  var FAKE_STUDENTS = [
    { name: '김덕배', code: '11111111', grade: 4, teacher: '김', points: 12000 },
    { name: '이하늘', code: '1234', grade: 4, teacher: '박', points: 8500 },
    { name: '이하늘', code: '1234', grade: 5, teacher: '최', points: 6000 },
    { name: '정민서', code: '5678', grade: 6, teacher: '이', points: 9500 }
  ];

  // ---------- 서버 요청 ----------
  function api(action, data) {
    if (!LIVE) return fakeApi(action, data);
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, S.TIMEOUT_MS);
    return fetch(S.API_URL, {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, data: data || {} })
    }).then(function (r) { return r.json(); })
      .finally(function () { clearTimeout(t); });
  }
  function fakeApi(action, d) {
    return new Promise(function (ok) {
      setTimeout(function () {
        if (action === 'ping') return ok({ ok: true });
        if (action === 'login') {
          var list = FAKE_STUDENTS.filter(function (s) {
            return s.name === d.name && s.code === d.code &&
              (!d.grade || (s.grade === d.grade && s.teacher === d.teacher));
          });
          if (!list.length) return ok({ ok: false, msg: '이름이나 초대코드를 다시 확인해 줘!' });
          if (list.length > 1) return ok({ ok: true, pick: list.map(function (s) { return { grade: s.grade, teacher: s.teacher }; }) });
          var s = list[0];
          return ok({ ok: true, student: { name: s.name, grade: s.grade, teacher: s.teacher, points: s.points } });
        }
        if (action === 'gameScore') return ok({ ok: true });
        ok({ ok: false, msg: '알 수 없는 요청' });
      }, 350);
    });
  }
  api('ping'); // 서버 미리 깨우기

  // ---------- 화면 이동 ----------
  var screens = ['invite', 'map', 'gameland', 'quizhouse', 'tree', 'award', 'post', 'guestbook', 'door', 'market', 'game'];
  function go(name) {
    if (name !== 'invite' && !me) name = 'invite';
    screens.forEach(function (n) { document.getElementById('s-' + n).classList.toggle('on', n === name); });
    document.getElementById('musicBtn').style.display = ['gameland','quizhouse','tree','door','market'].indexOf(name) >= 0 ? 'flex' : 'none';
    try { sessionStorage.setItem('cv-screen', name === 'game' ? 'gameland' : name); } catch (e) {}
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (b) { go(b.dataset.go); return; }
    if (e.target.closest('[data-music]')) { Music.toggle(); return; }
    var gm = e.target.closest('[data-game]');
    if (gm) { go('game'); Games.open(gm.dataset.game); return; }
    if (e.target.closest('.game-exit')) { Games.close(); go('gameland'); return; }
    var s = e.target.closest('[data-soon]');
    if (s) toast(s.dataset.soon + '<br><span style="font-size:1.5cqw">곧 열려요!</span>');
  });

  // ---------- 상단 메뉴줄 ----------
  var MENU = [['map', '홈'], ['gameland', '게임랜드'], ['quizhouse', '퀴즈하우스'], ['tree', '추억 트리'], ['market', '마켓'],
    ['award', '연말 시상식'], ['post', '비밀 우체국'], ['guestbook', '방명록'], ['door', '중3 문']];
  function buildNavs() {
    document.querySelectorAll('[data-nav]').forEach(function (nav) {
      var html = nav.dataset.nohello ? '<span style="margin-right:auto"></span>' :
        '<span class="hello">' + esc(me.name) + '님, <b>메리 크리스마스!</b></span>';
      MENU.forEach(function (m) {
        html += '<button data-go="' + m[0] + '"' + (m[0] === nav.dataset.nav ? ' class="on"' : '') + '>' + m[1] + '</button>';
      });
      html += '<button class="mus" data-music="1" aria-label="캐럴 끄기">' + (Music.isOn() ? '캐럴 끄기' : '캐럴 켜기') + '</button>';
      nav.innerHTML = html;
    });
  }

  // ---------- 로그인 ----------
  var inName = document.getElementById('inName'), inCode = document.getElementById('inCode');
  var msg = document.getElementById('loginMsg');
  function setMsg(t, err) { msg.textContent = t || ''; msg.className = 'login-msg' + (err ? ' err' : ''); }
  function tryLogin(extra) {
    var name = inName.value.trim(), code = inCode.value.trim();
    if (!name || !code) { setMsg('이름과 초대코드를 모두 입력해 줘!', true); return; }
    Music.start();
    setMsg('마을 문을 여는 중...');
    var d = { name: name, code: code };
    if (extra) { d.grade = extra.grade; d.teacher = extra.teacher; }
    api('login', d).then(function (r) {
      if (!r.ok) { setMsg(r.msg || '다시 시도해 줘!', true); return; }
      if (r.pick) { showPick(r.pick); setMsg(''); return; }
      onLogin(r.student);
    }).catch(function () { setMsg('연결이 느려요. 잠시 후 다시 눌러 줘!', true); });
  }
  function showPick(list) {
    var box = document.getElementById('pickList');
    box.innerHTML = '';
    list.forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'big-btn light'; b.textContent = S.classLabel(p);
      b.onclick = function () { document.getElementById('pickModal').classList.remove('on'); tryLogin(p); };
      box.appendChild(b);
    });
    document.getElementById('pickModal').classList.add('on');
  }
  function onLogin(st) {
    me = st;
    try { sessionStorage.setItem('cv-me', JSON.stringify(st)); } catch (e) {}
    setMsg('');
    document.getElementById('chipName').textContent = st.name + '님';
    document.getElementById('chipPt').textContent = st.points.toLocaleString() + '원';
    document.querySelectorAll('.who').forEach(function (el) { el.textContent = st.name; });
    buildNavs();
    go('map');
  }
  document.getElementById('loginBtn').onclick = function () { tryLogin(); };
  [inName, inCode].forEach(function (el) {
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); });
  });
  document.getElementById('logoutBtn').onclick = function () {
    me = null; try { sessionStorage.removeItem('cv-me'); } catch (e) {}
    inCode.value = ''; go('invite');
  };

  // ---------- 알림 ----------
  var tt;
  function toast(html) {
    var el = document.getElementById('toast');
    el.innerHTML = html; el.classList.add('on');
    clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('on'); }, 1400);
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---------- 캐럴 (징글벨, 직접 연주) ----------
  var Music = (function () {
    var ctx, gain, timer, on = true, playing = false;
    var N = { C4: 261.6, D4: 293.7, E4: 329.6, F4: 349.2, G4: 392, A4: 440, C5: 523.3, G3: 196 };
    var SONG = [['E4',1],['E4',1],['E4',2],['E4',1],['E4',1],['E4',2],['E4',1],['G4',1],['C4',1.5],['D4',.5],['E4',4],
      ['F4',1],['F4',1],['F4',1.5],['F4',.5],['F4',1],['E4',1],['E4',1],['E4',.5],['E4',.5],['E4',1],['D4',1],['D4',1],['E4',1],['D4',2],['G4',2],
      ['E4',1],['E4',1],['E4',2],['E4',1],['E4',1],['E4',2],['E4',1],['G4',1],['C4',1.5],['D4',.5],['E4',4],
      ['F4',1],['F4',1],['F4',1.5],['F4',.5],['F4',1],['E4',1],['E4',1],['E4',.5],['E4',.5],['G4',1],['G4',1],['F4',1],['D4',1],['C4',4],[null,4]];
    var BEAT = 0.26;
    function note(f, t, d) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + Math.max(d, 0.2));
      o.connect(g); g.connect(gain); o.start(t); o.stop(t + d + 0.05);
      var b = ctx.createOscillator(), bg = ctx.createGain(); // 종소리
      b.type = 'sine'; b.frequency.value = f * 2;
      bg.gain.setValueAtTime(0.25, t); bg.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      b.connect(bg); bg.connect(gain); b.start(t); b.stop(t + 0.4);
    }
    function loop() {
      if (!playing) return;
      var t = ctx.currentTime + 0.05, total = 0;
      SONG.forEach(function (n) { if (n[0]) note(N[n[0]], t + total * BEAT, n[1] * BEAT * 0.95); total += n[1]; });
      timer = setTimeout(loop, total * BEAT * 1000);
    }
    function start() {
      if (!on || playing) return;
      try {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        gain = gain || ctx.createGain(); gain.gain.value = 0.06; gain.connect(ctx.destination);
        ctx.resume(); playing = true; loop();
      } catch (e) {}
    }
    function stop() { playing = false; clearTimeout(timer); if (ctx) ctx.suspend(); }
    function toggle() {
      on = !on;
      var btn = document.getElementById('musicBtn');
      btn.classList.toggle('off', !on); btn.setAttribute('aria-label', on ? '캐럴 끄기' : '캐럴 켜기');
      document.querySelectorAll('.mus').forEach(function (m) { m.textContent = on ? '캐럴 끄기' : '캐럴 켜기'; });
      if (on) { if (ctx) ctx.resume(); playing = false; start(); } else stop();
    }
    return { start: start, toggle: toggle, isOn: function () { return on; } };
  })();
  document.getElementById('musicBtn').onclick = Music.toggle;

  // ---------- 게임에서 쓰는 것 ----------
  window.CV = {
    go: go,
    me: function () { return me; },
    saveScore: function (game, score) { api('gameScore', { name: me && me.name, game: game, score: score }); }
  };

  // ---------- 새로고침해도 로그인 유지 ----------
  try {
    var saved = JSON.parse(sessionStorage.getItem('cv-me') || 'null');
    if (saved) { onLogin(saved); go(sessionStorage.getItem('cv-screen') || 'map'); }
    else go('invite');
  } catch (e) { go('invite'); }
  document.addEventListener('pointerdown', function () { if (me) Music.start(); }, { once: true });
})();
</script>
